<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You meant to press YES right?</title>
    <!-- ပထမ Page က CSS ဖိုင်နှင့်ပဲ ပြန်လည်ချိတ်ဆက်ထားပါသည် -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ပင်မ Card Box -->
    <div class="question-card">
        
        <!-- ဒုတိယ Page အတွက် ကြောင်ပုံ -->
        <div class="image-section">
            <!-- မိမိနှစ်သက်ရာ GIF သို့မဟုတ် ပုံ၏ URL ကို ပြောင်းလဲနိုင်ပါသည် -->
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmNjdmM0a3VtOTY4YTZvYnlqODBzYjN5dmVsazFoZWQ1aTBocTRheiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/TbRkubcqlgBksEqMv4/200w.webp" alt="Suspicious Cat" class="cat-gif">
        </div>
        
        <!-- ဒုတိယ Page မေးခွန်းစာသား -->
        <div class="question-text">
            You meant to press YES right? 🙄
        </div>

        <!-- ခလုတ်များ (Link ချိတ်ဆက်နိုင်ရန် <a> tag ဖြင့် ပြောင်းလဲထားပါသည်) -->
        <div class="button-group">
            <!-- Yes နှိပ်ပါက Letter/Thank You Page သို့ သွားမည် (ဥပမာ- letter.html) -->
            <a href="page2.html" class="btn yes-btn yes-btn-large">Yes</a>
            
            <!-- No ကို ထပ်နှိပ်ပါက ဤ Page ၌ပင် ပြန်ရှိနေမည် သို့မဟုတ် နောက် Page သို့ သွားမည် -->
            <a href="page2.html" class="btn no-btn">No</a>
        </div>
    </div>

</body>
</html>
