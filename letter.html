<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Letters For You</title>
    <!-- မူရင်း style.css နှင့် ပြန်လည်ချိတ်ဆက်ခြင်း -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ထိပ်ဆုံးအလယ်တွင် ပေါ်မည့် စာသား -->
    <h1 class="victorian-title">Only for Nuuna Grace</h1>

    <!-- စာအိတ် ၃ ခုပါဝင်သော ပင်မ Container -->
    <div class="letters-wrapper">
        
        <!-- စာအိတ် ၁ -->
        <div class="letter-card">
            <!-- JS မပါဘဲ နှိပ်ရင် ပွင့်စေရန် သုံးထားသော Checkbox -->
            <input type="checkbox" id="env1" class="env-toggle">
            
            <div class="envelope">
                <div class="envelope-icon">📩</div>
                
                <!-- စာအိတ် ပွင့်လာပါက ပေါ်လာမည့် စာစောင် (စာအိတ် ၁) -->
                <div class="letter-content">
                    <p>အများကြီးသတိရနေတာ....</p>
                </div>
            </div>

            <!-- Read ခလုတ် -->
            <label for="env1" class="btn read-btn">Read</label>
        </div>

        <!-- စာအိတ် ၂ -->
        <div class="letter-card">
            <input type="checkbox" id="env2" class="env-toggle">
            
            <div class="envelope">
                <div class="envelope-icon">📩</div>
                
                <!-- စာအိတ် ပွင့်လာပါက ပေါ်လာမည့် စာစောင် (စာအိတ် ၂) -->
                <div class="letter-content">
                    <p> စကားလာမပြောတာ ပစ်ထားတာ မဟုတ်ဘူးနော်။ </p>
                </div>
            </div>

            <label for="env2" class="btn read-btn">Read</label>
        </div>

        <!-- စာအိတ် ၃ -->
        <div class="letter-card">
            <input type="checkbox" id="env3" class="env-toggle">
            
            <div class="envelope">
                <div class="envelope-icon">📩</div>
                
                <!-- စာအိတ် ပွင့်လာပါက ပေါ်လာမည့် စာစောင် (စာအိတ် ၃) -->
                <div class="letter-content">
                    <p>သတိရတိုင်း ခေါက်ထားတဲ့ ကြယ်လေးတွေရှိတယ်။ ကြည့်ချင်ရင် cb...😁</p>
                </div>
            </div>

            <label for="env3" class="btn read-btn">Read</label>
        </div>

    </div>

</body>
</html>
